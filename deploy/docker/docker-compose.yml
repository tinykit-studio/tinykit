services:
  crud-one:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Optional: configure AI here, or in Settings after setup
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}

      - LLM_BASE_URL=${LLM_BASE_URL:-}

      # Server config
      - HOST=0.0.0.0
      - PORT=3000
      - BODY_SIZE_LIMIT=${BODY_SIZE_LIMIT:-10M}
      - WORKSPACE_DIR=/app/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Persistent storage
      - pocketbase_data:/app/pocketbase/pb_data
      - workspace_data:/app/workspace

    restart: unless-stopped

volumes:
  pocketbase_data:
  workspace_data:
